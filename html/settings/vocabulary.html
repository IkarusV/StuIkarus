<div id="ch-tab-vocabulary">
    <div class="st-chatu8-settings-section">
        <h3>Vocabulary Management</h3>
        <div class="st-chatu8-field">
            <label>Batch Actions</label>
            <div>
                <button id="vocabulary-install-all-btn" class="st-chatu8-btn">Install All</button>
                <button id="vocabulary-uninstall-all-btn" class="st-chatu8-btn danger">Uninstall All</button>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label>Available Vocabularies (three or four are enough on mobile)</label>
            <div id="vocabulary-file-list" class="st-chatu8-vocabulary-list"></div>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Tag Browser</h3>
        <div class="st-chatu8-field-col">
            <textarea id="vocabulary-selected-tags" class="st-chatu8-textarea" rows="3" placeholder="Click a tag below to add it here..."></textarea>
            <div class="st-chatu8-tag-browser-actions">
                <button id="vocabulary-tag-backspace" class="st-chatu8-btn">Backspace</button>
                <button id="vocabulary-tag-clear" class="st-chatu8-btn danger">Clear</button>
                <button id="vocabulary-tag-copy" class="st-chatu8-btn">Copy</button>
            </div>
        </div>
        <div id="vocabulary-tree-container" class="st-chatu8-tree-container"></div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Manual Tag Management</h3>
        <div class="st-chatu8-field-col" style="gap: 10px;">
            <label>Add New Tag</label>
            <div class="st-chatu8-input-group" style="flex-wrap: wrap;">
                <input type="text" id="vocabulary-manual-tag-original-input" class="st-chatu8-text-input" placeholder="Original tag..." style="min-width: 120px; flex: 1;">
                <input type="text" id="vocabulary-manual-tag-translation-input" class="st-chatu8-text-input" placeholder="Tag translation..." style="min-width: 120px; flex: 1;">
                <button id="vocabulary-manual-tag-add-btn" class="st-chatu8-btn">Add</button>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label>Actions</label>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                <button id="vocabulary-manual-tags-refresh-btn" class="st-chatu8-btn">Refresh List</button>
                <button id="vocabulary-manual-tags-export-btn" class="st-chatu8-btn">Export</button>
                <button id="vocabulary-manual-tags-import-btn" class="st-chatu8-btn">Import</button>
                <input type="file" id="vocabulary-manual-tags-import-input" accept=".json" style="display: none;">
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                <label style="min-width: 120px;">Manually Added Tags</label>
                <input type="text" id="vocabulary-manual-tags-filter-input" class="st-chatu8-text-input" placeholder="Filter tags..." style="flex: 1; min-width: 150px; max-width: 300px;">
            </div>
            <div id="vocabulary-manual-tags-list" class="st-chatu8-vocabulary-list" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Search Settings</h3>
        <div class="st-chatu8-field">
            <label for="vocabulary_search_startswith">Prefix Match</label>
            <div class="st-chatu8-toggle">
                <input id="vocabulary_search_startswith" type="checkbox"/>
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="vocabulary_search_limit">Maximum Results</label>
            <input type="number" id="vocabulary_search_limit" class="st-chatu8-text-input" min="1" max="1000">
        </div>
        <div class="st-chatu8-field">
            <label for="vocabulary_search_sort">Sort Order</label>
            <select id="vocabulary_search_sort" class="st-chatu8-select">
                <option value="hot_asc">Popularity, Ascending</option>
                <option value="hot_desc">Popularity, Descending</option>
                <option value="key_asc">English Name, Ascending</option>
            </select>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Test</h3>
        <div class="st-chatu8-field">
            <label for="vocabulary-search-input">Search</label>
            <div class="st-chatu8-input-group">
                <input type="text" id="vocabulary-search-input" class="st-chatu8-text-input" placeholder="Enter keywords...">
                <button id="vocabulary-search-btn" class="st-chatu8-btn">Search</button>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label>Search Results</label>
            <div id="vocabulary-search-results" class="st-chatu8-textarea" style="height: 150px; overflow-y: auto;"></div>
        </div>
    </div>
</div>
