<div id="ch-tab-image-cache">
    <div class="st-chatu8-settings-section">
        <h3>Image Cache Management</h3>
        <div class="st-chatu8-cache-controls">
            <button id="image-cache-toggle-multiselect" class="st-chatu8-btn">Multi-select</button>
            <button id="image-cache-select-all" class="st-chatu8-btn">Select All</button>
            <button id="image-cache-deselect-all" class="st-chatu8-btn">Deselect All</button>
            <button id="image-cache-download-selected" class="st-chatu8-btn"><i class="fa-solid fa-download"></i> Download Selected</button>
            <button id="image-cache-delete-selected" class="st-chatu8-btn danger"><i class="fa-solid fa-trash"></i> Delete Selected</button>
            <button id="image-cache-recalc-size" class="st-chatu8-btn"><i class="fa-solid fa-calculator"></i> Calculate Size</button>
            <button id="image-cache-recalc-all" class="st-chatu8-btn"><i class="fa-solid fa-rotate"></i> Recalculate All</button>
        </div>
        <div id="image-cache-recalc-progress" class="st-chatu8-recalc-progress" style="display: none;">
            <div class="st-chatu8-recalc-header">
                <span id="image-cache-recalc-title">Calculating...</span>
                <button id="image-cache-recalc-cancel" class="st-chatu8-btn danger">Cancel</button>
            </div>
            <div class="st-chatu8-recalc-bar-track">
                <div id="image-cache-recalc-bar" class="st-chatu8-recalc-bar-fill"></div>
            </div>
            <div id="image-cache-recalc-detail" class="st-chatu8-recalc-detail"></div>
        </div>
        <div id="image-cache-grid" class="st-chatu8-image-cache-grid">
            <!-- Images will be loaded here -->
        </div>
        <div id="image-cache-pagination" class="st-chatu8-pagination">
            <!-- Pagination controls will be here -->
            <div class="st-chatu8-field" id="image-cache-jump-container" style="display: none; margin-left: 10px;">
                <label for="image-cache-jump-input">Go to</label>
                <div class="st-chatu8-input-group">
                    <input type="number" id="image-cache-jump-input" class="st-chatu8-page-jump-input" placeholder="Page number" min="1">
                    <button id="image-cache-jump-button" class="st-chatu8-btn">Go</button>
                </div>
            </div>
        </div>
        <div id="image-cache-info" class="st-chatu8-cache-info"></div>
    </div>
</div>
