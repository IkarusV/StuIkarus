<div id="ch-tab-regex">
    <div class="st-chatu8-settings-section">
        <h3>Regex Settings</h3>
        <div class="st-chatu8-field">
            <label for="ch-regex-profile-select">Regex Profile</label>
            <div class="st-chatu8-profile-controls">
                <select id="ch-regex-profile-select" class="st-chatu8-select"></select>
                <button class="st-chatu8-icon-btn" id="ch-new-regex-profile-button" title="New"><i class="fa-solid fa-plus"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-rename-regex-profile-button" title="Rename"><i class="fa-solid fa-pen"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-save-regex-profile-button" title="Save"><i class="fa-solid fa-save"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-save-as-regex-profile-button" title="Save As"><i class="fa-solid fa-floppy-disk"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-import-regex-profile-button" title="Import"><i class="fa-solid fa-file-import"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-export-regex-profile-button" title="Export"><i class="fa-solid fa-file-export"></i></button>
                <button class="st-chatu8-icon-btn danger" id="ch-delete-regex-profile-button" title="Delete"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-before-after-editor">Leading/Trailing Regex (remove surrounding text)</label>
            <textarea id="ch-regex-before-after-editor" class="st-chatu8-textarea" rows="3" placeholder="Enter a regular expression..."></textarea>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-text-editor">Text Regex (replace content)</label>
            <textarea id="ch-regex-text-editor" class="st-chatu8-textarea" rows="5" placeholder="Enter a regular expression..."></textarea>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Regex Preset Editor</h4>
        <div class="st-chatu8-field">
            <div class="st-chatu8-profile-controls">
                <button class="st-chatu8-btn" id="ch-add-regex-entry-button" title="Create regex entry">
                    <i class="fa-solid fa-plus"></i> New
                </button>
                <button class="st-chatu8-btn" id="ch-import-regex-entry-button" title="Import regex entry">
                    <i class="fa-solid fa-file-import"></i> Import
                </button>
                <button class="st-chatu8-btn" id="ch-import-regex-entry-engine-button" title="Import from the ST regex engine">
                    <i class="fa-solid fa-download"></i> Import from ST Engine
                </button>
            </div>
        </div>
        <div id="ch-regex-entries-container" class="st-chatu8-preset-entries-container">
            <!-- 正则条目将在这里动态渲染 -->
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Simple Vocabulary Replacement</h4>
        <div class="st-chatu8-field">
            <label for="ch-word-replace-profile-select">Replacement Profile</label>
            <div class="st-chatu8-profile-controls">
                <select id="ch-word-replace-profile-select" class="st-chatu8-select"></select>
                <button class="st-chatu8-icon-btn" id="ch-new-word-replace-profile-button" title="New"><i class="fa-solid fa-plus"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-rename-word-replace-profile-button" title="Rename"><i class="fa-solid fa-pen"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-save-word-replace-profile-button" title="Save"><i class="fa-solid fa-save"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-import-word-replace-profile-button" title="Import"><i class="fa-solid fa-file-import"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-export-word-replace-profile-button" title="Export"><i class="fa-solid fa-file-export"></i></button>
                <button class="st-chatu8-icon-btn danger" id="ch-delete-word-replace-profile-button" title="Delete"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-word-replace-text-editor">Body Replacement (replace chat text when displayed)</label>
            <textarea id="ch-word-replace-text-editor" class="st-chatu8-textarea" rows="5" placeholder="One rule per line, format: term1=term2&#10;Example: term=🍆"></textarea>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-word-replace-ai-editor">AI Response Replacement (replace before parsing AI output)</label>
            <textarea id="ch-word-replace-ai-editor" class="st-chatu8-textarea" rows="3" placeholder="One rule per line, format: term1=term2&#10;Example: safe_="></textarea>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Gesture Recording</h4>
        <div class="st-chatu8-field">
            <label for="ch-gesture-enabled">Enable Gestures</label>
            <div class="st-chatu8-toggle">
                <input id="ch-gesture-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-click-trigger-enabled">Enable Click Trigger</label>
            <div class="st-chatu8-toggle">
                <input id="ch-click-trigger-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-1-button">Gesture One</label>
            <button class="st-chatu8-btn" id="ch-gesture-1-button">Record Gesture One</button>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-2-button">Gesture Two</label>
            <button class="st-chatu8-btn" id="ch-gesture-2-button">Record Gesture Two</button>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-image-gen-demand-enabled">Image Generation Request Dialog</label>
            <div class="st-chatu8-toggle">
                <input id="ch-image-gen-demand-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-default-char-demand">Default User Request for Character Generation</label>
            <textarea id="ch-default-char-demand" class="st-chatu8-textarea" rows="2" placeholder="Use this default when the user request is blank..."></textarea>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-default-image-demand">Default User Request for Image Generation</label>
            <textarea id="ch-default-image-demand" class="st-chatu8-textarea" rows="2" placeholder="Use this default when the user request is blank..."></textarea>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-show-recognition">Show Recognition</label>
            <div class="st-chatu8-toggle">
                <input id="ch-gesture-show-recognition" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-show-trail">Show Stroke Trail</label>
            <div class="st-chatu8-toggle">
                <input id="ch-gesture-show-trail" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-trail-color">Stroke Color</label>
            <input type="color" id="ch-gesture-trail-color" class="st-chatu8-input">
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-match-threshold">Match Threshold</label>
            <input type="range" id="ch-gesture-match-threshold" class="st-chatu8-slider-input" min="0" max="100" step="1">
            <span id="ch-gesture-match-threshold-value" class="st-chatu8-slider-value"></span>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Test Tools</h4>
        <div class="st-chatu8-field">
            <label for="ch-regex-test-mode">Test Mode</label>
            <div class="st-chatu8-toggle">
                <input id="ch-regex-test-mode" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-test-original-text">Original Text</label>
            <textarea id="ch-regex-test-original-text" class="st-chatu8-textarea" rows="6"></textarea>
        </div>
        <div style="text-align: center; margin: 10px 0;">
            <button class="st-chatu8-btn" id="ch-test-regex-button">
                <i class="fa-solid fa-arrow-down"></i>
                Apply Regex and Test
                <i class="fa-solid fa-arrow-down"></i>
            </button>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-test-result-text">Text After Regex</label>
            <textarea id="ch-regex-test-result-text" class="st-chatu8-textarea" rows="6" readonly></textarea>
        </div>
    </div>
</div>
