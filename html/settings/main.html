<div id="ch-tab-main">
    <div class="st-chatu8-settings-section">
        <h3>Main Settings</h3>
        <div class="st-chatu8-field">
            <label for="scriptEnabled">Enable Plugin</label>
            <div class="st-chatu8-toggle">
                <input id="scriptEnabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="helpTipsEnabled">Show Setting Help Tips</label>
            <div class="st-chatu8-toggle">
                <input id="helpTipsEnabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="mode">Mode</label>
            <select id="mode" class="st-chatu8-select">
                <option value="sd">SD</option>
                <option value="novelai">NovelAI</option>
                <option value="comfyui">ComfyUI</option>
                <option value="banana">Banana/Grok</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="client">Client</label>
            <select id="client" class="st-chatu8-select">
                <option value="browser">Browser</option>
                <option value="jiuguan">Tavern</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="dbclike">Hide Button (double-click image to trigger)</label>
            <div class="st-chatu8-toggle">
                <input id="dbclike" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="collapseImage">Collapse Images</label>
            <div class="st-chatu8-toggle">
                <input id="collapseImage" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="zidongdianji">Automatically Click Generate</label>
            <div class="st-chatu8-toggle">
                <input id="zidongdianji" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="zidongdianji2">Auto Click (do not enable unnecessarily)</label>
            <div class="st-chatu8-toggle">
                <input id="zidongdianji2" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="longPressToEdit">Long-Press Image to Edit Tags</label>
            <div class="st-chatu8-toggle">
                <input id="longPressToEdit" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="clickToPreview">Click Image to Preview</label>
            <div class="st-chatu8-toggle">
                <input id="clickToPreview" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="newlineFixEnabled">Line Break Fix</label>
            <div class="st-chatu8-toggle">
                <input id="newlineFixEnabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="enablePregen">Enable Streaming Pre-generation</label>
            <div class="st-chatu8-toggle">
                <input id="enablePregen" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="autoLLMImageGen">Automatically Request Image Generation from LLM (non-same-level)</label>
            <div class="st-chatu8-toggle">
                <input id="autoLLMImageGen" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="randomYushe">Random Prompt Preset</label>
            <div class="st-chatu8-toggle">
                <input id="randomYushe" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="aiAutonomousResolution">AI-Selected Resolution</label>
            <div class="st-chatu8-toggle">
                <input id="aiAutonomousResolution" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="imageGenInterval">Image Generation Interval (ms)</label>
            <input type="number" id="imageGenInterval" class="st-chatu8-text-input" min="0" step="100" placeholder="0">
        </div>

        <div class="st-chatu8-field">
            <label for="imageAlignment">Image Alignment</label>
            <select id="imageAlignment" class="st-chatu8-select">
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="imageSizeScale">Image Display Size</label>
            <select id="imageSizeScale" class="st-chatu8-select">
                <option value="100">Adaptive (100%)</option>
                <option value="75">3/4 Size (75%)</option>
                <option value="50">1/2 Size (50%)</option>
                <option value="25">1/4 Size (25%)</option>
            </select>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Tags</h3>
        <div class="st-chatu8-field">
            <label for="startTag">Start Tag</label>
            <input type="text" id="startTag" class="st-chatu8-text-input">
        </div>
        <div class="st-chatu8-field">
            <label for="endTag">End Tag</label>
            <input type="text" id="endTag" class="st-chatu8-text-input">
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Tag Storage Mode</h3>
        <div class="st-chatu8-field">
            <label for="insertOriginalText">Insert Original Text (non-same-level)</label>
            <div class="st-chatu8-toggle">
                <input id="insertOriginalText" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Cache Management (clear with the buttons below)</h3>
        <div class="st-chatu8-field">
            <label for="cache">Cache to Clear</label>
            <select id="cache" class="st-chatu8-select">
                <option value="0">Stop Caching</option>
                <option value="1">Clear Items Older Than One Day</option>
                <option value="7">Clear Items Older Than One Week</option>
                <option value="30">Clear Items Older Than One Month</option>
                <option value="365">Clear Items Older Than One Year</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="jiuguanchucun">Cache Images in Tavern</label>
            <div class="st-chatu8-toggle">
                <input id="jiuguanchucun" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="vibeJiuguanchucun">Cache Vibe in Tavern</label>
            <div class="st-chatu8-toggle">
                <input id="vibeJiuguanchucun" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="convertToJpegStorage">Store as JPEG to Save 70% Space (noticeably more noise)</label>
            <div class="st-chatu8-toggle">
                <input id="convertToJpegStorage" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label>Actions</label>
            <div>
                <button id="sync-server-images-btn" class="st-chatu8-btn">Clean Invalid Images</button>
                <button id="migrate-vibe-storage-btn" class="st-chatu8-btn">Migrate Vibe to Tavern</button>
                <button id="Clear-Cache" class="st-chatu8-btn danger">Clear Image Cache</button>
                <button id="migrate-database-btn" class="st-chatu8-btn">Migrate Data</button>
                <button id="diagnose-config-storage-btn" class="st-chatu8-btn">Clean Invalid Stored Data</button>
            </div>
        </div>
    </div>
</div>
