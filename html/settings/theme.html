<div id="ch-tab-theme">
    <div class="st-chatu8-settings-section">
        <h3>Theme Settings</h3>
        <div class="st-chatu8-field">
            <label for="theme_id">Theme Preset</label>
            <div class="st-chatu8-profile-controls">
                <select id="theme_id" class="st-chatu8-select"></select>
                <button class="st-chatu8-icon-btn" id="theme_save_style" title="Save"><i class="fa-solid fa-save"></i></button>
                <button class="st-chatu8-icon-btn" id="theme_export_current" title="Export Current"><i class="fa-solid fa-upload"></i></button>
                <button class="st-chatu8-icon-btn" id="theme_export_all" title="Export All"><i class="fa-solid fa-file-export"></i></button>
                <button class="st-chatu8-icon-btn" id="theme_import" title="Import"><i class="fa-solid fa-download"></i></button>
                <button class="st-chatu8-icon-btn danger" id="theme_delete_style" title="Delete"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="theme_generate_btn_style">Generate Button Style</label>
            <select id="theme_generate_btn_style" class="st-chatu8-select">
                <option value="默认">Default</option>
                <option value="渐变-蓝紫">Blue-Purple Gradient</option>
                <option value="渐变-橙红">Orange-Red Gradient</option>
                <option value="科技霓虹">Tech Neon</option>
                <option value="极简黑白">Minimal Black and White</option>
                <option value="玻璃拟态">Glassmorphism</option>
                <option value="少女心">Sweetheart</option>
                <option value="森林系">Forest</option>
                <option value="星空紫">Starry Purple</option>
                <option value="魔法图标">Magic Icons</option>
                <option value="赛博几何">Cyber Geometry</option>
                <option value="手绘风格">Hand-drawn</option>
                <option value="极简文字">Minimal Text</option>
                <option value="冰封水晶">Frozen Crystal</option>
                <option value="流光宝石">Shimmering Gem</option>
                <option value="悬浮胶囊">Floating Capsule</option>
                <option value="全息立方">Holographic Cube</option>
                <option value="赛博方块">Cyber Blocks</option>
                <option value="森林图标">Forest Icons</option>
                <option value="少女图标">Sweetheart Icons</option>
                <option value="星空图标">Starry Sky Icons</option>
                <option value="霓虹图标">Neon Icons</option>
                <option value="宝石图标">Gem Icons</option>
                <option value="原木质感">Natural Wood</option>
                <option value="云朵白">Cloud White</option>
                <option value="水流蓝">Flowing Blue</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="theme_image_frame_style">Image Frame Style</label>
            <select id="theme_image_frame_style" class="st-chatu8-select">
                <option value="无样式">None</option>
                <option value="简约白边">Minimal White Border</option>
                <option value="柔和阴影">Soft Shadow</option>
                <option value="圆角相框">Rounded Frame</option>
                <option value="复古画框">Vintage Frame</option>
                <option value="科技边框">Tech Border</option>
                <option value="霓虹光晕">Neon Glow</option>
                <option value="玻璃质感">Glass Texture</option>
                <option value="渐变边框">Gradient Border</option>
                <option value="金色画框">Gold Frame</option>
                <option value="极简线条">Minimal Lines</option>
                <option value="浮雕效果">Embossed</option>
                <option value="漫画风格">Comic Style</option>
                <option value="胶片边框">Film Border</option>
            </select>
        </div>
        <div class="st-chatu8-field">
            <label for="theme_collapse_style">Collapsible Panel Style</label>
            <select id="theme_collapse_style" class="st-chatu8-select">
                <option value="默认">Default</option>
                <option value="极简线条">Minimal Lines</option>
                <option value="科技霓虹">Tech Neon</option>
                <option value="玻璃质感">Glass Texture</option>
                <option value="暖色温馨">Warm and Cozy</option>
                <option value="森林绿意">Forest Green</option>
                <option value="少女粉彩">Pastel</option>
                <option value="星空紫">Starry Purple</option>
            </select>
        </div>
        <div id="theme-color-pickers" class="st-chatu8-grid">
            <!-- Color pickers will be dynamically inserted here -->
        </div>
    </div>
</div>
